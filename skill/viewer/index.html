<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unfold</title>
<style>
:root {
  --bg: #faf9f6; --surface: #ffffff; --panel: #f1efe9; --text: #1f1e1c; --muted: #6b6963; --line: #d8d5cc;
  --accent: #2f6fd6; --assume-bg: #eeedfe; --assume-line: #7f77dd; --assume-text: #3c3489;
  --added-bg: #faeeda; --added-line: #ba7517; --added-text: #633806; --danger: #a32d2d; --danger-bg: #fcebeb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1a18; --surface: #262522; --panel: #2f2e2a; --text: #ecebe6; --muted: #a3a199; --line: #4a4843;
    --accent: #7fb0f5; --assume-bg: #322d5e; --assume-line: #afa9ec; --assume-text: #dddbfa;
    --added-bg: #4a3410; --added-line: #ef9f27; --added-text: #fbe2b5; --danger: #f09595; --danger-bg: #4a1c1c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
.page { max-width: 1100px; margin: 0 auto; padding: 24px 20px 64px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 22px 0 6px; }
.pill { font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.confirmed { border-color: var(--accent); color: var(--accent); }
.request { margin: 8px 0 0; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 14px; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); margin-right: 6px; vertical-align: -1px; }
.sw.assumption { background: var(--assume-bg); border-color: var(--assume-line); }
.sw.added { background: var(--added-bg); border-color: var(--added-line); }
.issues { margin-top: 14px; border-radius: 8px; padding: 10px 14px; font-size: 13px; background: var(--panel); }
.issues.error { background: var(--danger-bg); color: var(--danger); }
.issues ul { margin: 4px 0 0; padding-left: 18px; }
.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
svg { display: block; }
.node { cursor: pointer; outline: none; }
.node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.node.o-assumption rect { fill: var(--assume-bg); stroke: var(--assume-line); }
.node.o-added rect { fill: var(--added-bg); stroke: var(--added-line); }
.node:hover rect, .node:focus-visible rect { stroke-width: 2; }
.node.selected rect { stroke: var(--accent); stroke-width: 2.5; }
.node text { text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.node .title { font-size: 14px; font-weight: 500; fill: var(--text); }
.node .id { fill: var(--muted); font-weight: 400; }
.node .subtitle { font-size: 12px; fill: var(--muted); }
.node.o-assumption .title, .node.o-assumption .subtitle, .node.o-assumption .id { fill: var(--assume-text); }
.node.o-added .title, .node.o-added .subtitle, .node.o-added .id { fill: var(--added-text); }
.node rect.badge { fill: var(--accent); stroke: none; }
.node .badge-text { font-size: 11px; fill: var(--bg); font-weight: 500; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.3; }
.edge.dashed { stroke-dasharray: 5 4; }
.arrowhead { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.edge-label { font-size: 12px; fill: var(--muted); text-anchor: middle; dominant-baseline: central; stroke: var(--surface); stroke-width: 5px; paint-order: stroke; }
.detail { background: var(--panel); border-radius: 8px; padding: 10px 14px; margin-top: 6px; font-size: 14px; }
.detail b { font-weight: 600; }
.detail .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 28px; margin-top: 12px; }
.lists ul { margin: 0; padding-left: 18px; font-size: 14px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
